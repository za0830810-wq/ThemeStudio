name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ThemeStudio.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon
        working-directory: ThemeStudio
      - uses: actions/upload-artifact@v4
        with:
          name: ThemeStudio-APK
          path: ThemeStudio/app/build/outputs/apk/debug/app-debug.apk
